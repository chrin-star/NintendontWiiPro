
name: Build Nintendont Wii Pro

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITPPC: /opt/devkitpro/devkitPPC
      DEVKITARM: /opt/devkitpro/devkitARM

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM toolchain if missing
        run: |
          if ! command -v arm-none-eabi-gcc >/dev/null 2>&1; then
            dkp-pacman -Sy --noconfirm devkitARM
          fi

      - name: Diagnose legacy libOGC API
        run: |
          echo "=== Installed libOGC headers ==="
          find /opt/devkitpro/libogc/include \
            -iname '*lwp*' -o -iname '*system*'

          echo "=== Legacy definitions ==="
          grep -RnE \
            'STACK_ALIGN|__lwp_thread_stopmultitasking|define read32|define write32' \
            /opt/devkitpro/libogc/include \
            /opt/devkitpro/devkitPPC 2>/dev/null \
            | head -80 || true

          echo "=== Available symbols ==="
          find /opt/devkitpro/libogc -name '*.a' \
            -exec powerpc-eabi-nm -A {} \; 2>/dev/null \
            | grep -E \
            '__lwp_thread_stopmultitasking|read32|write32' \
            | head -40 || true

      - name: Prepare legacy header compatibility
        run: |
          mkdir -p compat/ogc

          cat > compat/ogc/lwp_threads.h <<'EOF'
          #ifndef NINTENDONT_LEGACY_LWP_THREADS_H
          #define NINTENDONT_LEGACY_LWP_THREADS_H

          #include <ogc/lwp.h>

          #endif
          EOF

      - name: Compile Nintendont
        run: |
          export C_INCLUDE_PATH="$GITHUB_WORKSPACE/compat"
          make -j1

      - name: Find generated files
        if: success()
        run: |
          find . -type f -name '*.dol' -print

      - name: Upload build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NintendontWiiPro-test
          path: nintendont/boot.dol
          if-no-files-found: error
          
