
name: Build Nintendont Wii Pro

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITPPC: /opt/devkitpro/devkitPPC
      DEVKITARM: /opt/devkitpro/devkitARM

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preserve original build files
        run: |
          set -eu

          mkdir -p /tmp/nintendont-rules

          find "$DEVKITPPC" \
            -maxdepth 1 \
            -type f \
            -exec cp -v {} /tmp/nintendont-rules/ \;

          echo "=== Preserved files ==="
          ls -lah /tmp/nintendont-rules/

          test -f /tmp/nintendont-rules/wii_rules
          test -f /tmp/nintendont-rules/base_rules
          test -f /tmp/nintendont-rules/base_tools

      - name: Download historical toolchains
        run: |
          set -eu

          mkdir -p /tmp/nintendont-tools
          cd /tmp/nintendont-tools

          curl -fL --retry 3 \
            -o arm.pkg.tar.xz \
            'https://wii.leseratte10.de/devkitPro/devkitARM/r53%20%282019-06%29/devkitARM-r53-1-linux.pkg.tar.xz'

          curl -fL --retry 3 \
            -o ppc.pkg.tar.xz \
            'https://wii.leseratte10.de/devkitPro/devkitPPC/r35/devkitPPC-r35-1-linux.pkg.tar.xz'

          curl -fL --retry 3 \
            -o libogc.pkg.tar.xz \
            'https://wii.leseratte10.de/devkitPro/libogc/libogc_1.8.23%20%282019-10-02%29/libogc-1.8.23-1-any.pkg.tar.xz'

          echo "=== Downloaded packages ==="
          ls -lh *.pkg.tar.xz

      - name: Install historical toolchains
        run: |
          set -eu

          cd /tmp/nintendont-tools

          rm -rf "$DEVKITARM"
          rm -rf "$DEVKITPPC"
          rm -rf "$DEVKITPRO/libogc"

          tar -xJf arm.pkg.tar.xz -C /
          tar -xJf ppc.pkg.tar.xz -C /
          tar -xJf libogc.pkg.tar.xz -C /

          echo "=== Restore original build files ==="

          cp -v /tmp/nintendont-rules/* "$DEVKITPPC/"

          echo "=== Verify dependencies ==="

          test -f "$DEVKITPPC/wii_rules"
          test -f "$DEVKITPPC/base_rules"
          test -f "$DEVKITPPC/base_tools"
          test -f "$DEVKITPPC/gamecube_rules"

          test -f \
            "$DEVKITPRO/libogc/include/ogc/lwp_threads.h"

          echo "=== Compiler versions ==="

          "$DEVKITARM/bin/arm-none-eabi-gcc" --version
          "$DEVKITPPC/bin/powerpc-eabi-gcc" --version

          echo "=== Restored files ==="
          ls -lah "$DEVKITPPC/"*rules
          ls -lah "$DEVKITPPC/"*tools

      - name: Compile Nintendont
        run: |
          set -eu

          export PATH="$DEVKITPPC/bin:$DEVKITARM/bin:$PATH"

          make -j1

      - name: Locate generated DOL
        if: success()
        run: |
          echo "=== Generated DOL files ==="
          find . -type f -name '*.dol' -print

      - name: Upload compiled DOL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NintendontWiiPro-test
          path: |
            loader/*.dol
            loader/boot.dol
          if-no-files-found: error
          
