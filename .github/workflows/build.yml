
name: Diagnose Nintendont Toolchain

on:
  push:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download historical PPC package
        run: |
          curl -fL --retry 3 \
            -o /tmp/ppc.pkg.tar.xz \
            'https://wii.leseratte10.de/devkitPro/devkitPPC/r35/devkitPPC-r35-1-linux.pkg.tar.xz'

      - name: Inspect package and rules
        run: |
          echo "=== PACKAGE CONTENTS ==="
          tar -tf /tmp/ppc.pkg.tar.xz \
            | grep -E 'wii_rules|base_rules|gamecube_rules|bin/powerpc-eabi-gcc' \
            || true

          echo "=== PACKAGE ROOT ==="
          tar -tf /tmp/ppc.pkg.tar.xz | head -30 || true

          echo "=== CURRENT INSTALLATION ==="
          find /opt/devkitpro \
            -name 'wii_rules' \
            -o -name 'base_rules' \
            -o -name 'gamecube_rules'

          echo "=== FATFS MAKEFILE ==="
          sed -n '1,100p' fatfs/Makefile.ppc

          echo "=== CURRENT VARIABLES ==="
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"
          
